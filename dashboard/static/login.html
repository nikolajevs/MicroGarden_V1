<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>MicroGarden · Вход</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f19'/%3E%3Cpath d='M16 25V13m0 0c0-4 3-7 8-7 0 5-3 7-8 7zm0 4c0-3-2-5-6-5 0 4 2 5 6 5z' fill='none' stroke='%2310b981' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap auth-wrap">
  <header class="top">
    <div>
      <h1>MicroGarden</h1>
    </div>
  </header>

  <section class="panel auth-card" aria-labelledby="login-title">
    <h2 id="login-title">Вход</h2>
    <p id="notice" class="empty" role="status" hidden>Пароль изменён. Войдите с новым паролем.</p>
    <form id="login-form" class="auth-form" novalidate>
      <label class="field">
        <span class="label">Имя или почта</span>
        <input class="input" id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required>
      </label>
      <label class="field">
        <span class="label">Пароль</span>
        <input class="input" id="password" type="password" autocomplete="current-password" maxlength="128" required>
      </label>
      <button type="submit" class="btn primary" id="submit">Войти</button>
    </form>
    <p id="error" class="form-error" role="alert" hidden></p>
    <div id="google-box" class="auth-alt" hidden>
      <span class="legend-note">или</span>
      <a class="btn google" id="google-link" href="/auth/google"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Войти через Google</span></a>
      <span class="legend-note">Если вы регистрировались через Google, пароля у записи нет: входите через Google или задайте пароль в «Аккаунте».</span>
    </div>
    <p id="forgot-note" class="legend-note" hidden><a href="/forgot">Забыли пароль?</a></p>
    <p id="register-note" class="legend-note">Нет учётной записи? <a href="/register">Зарегистрироваться</a></p>
  </section>
</div>
<script src="/auth-lib.js"></script>
<script src="/login.js"></script>
</body>
</html>
