# Виртуальный хост dash.dvinsk.lat на VPS: обратный прокси к серверу телеметрии на
# 127.0.0.1:8790. Сделан по образцу хоста todo.dvinsk.lat.
#
# Схема: интернет -> Traefik на хосте 93.127.143.133 (HTTPS, сертификат Let's Encrypt)
#        -> этот nginx, порт 80 (с адреса 192.168.122.1) -> сервер телеметрии.
# HTTPS заканчивается на Traefik, поэтому здесь только порт 80, а certbot не нужен.
server {
    listen 80;
    listen [::]:80;
    server_name dash.dvinsk.lat;

    # Настоящий адрес клиента: Traefik дописывает его в X-Forwarded-For. Без этого все
    # запросы выглядели бы как приходящие с 192.168.122.1, и защита от подбора пароля
    # блокировала бы всех сразу, включая плату.
    set_real_ip_from 192.168.122.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Запрос платы — единицы килобайт; 128 КБ с запасом, остальное nginx отрежет сам.
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
